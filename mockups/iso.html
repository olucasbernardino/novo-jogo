<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const W=1440,H=900,DPR=2,cv=document.getElementById('c');cv.width=W*DPR;cv.height=H*DPR;const ctx=cv.getContext('2d');ctx.scale(DPR,DPR);
const TAU=Math.PI*2,TW=100,TH=50,OX=720,OY=150,N=13;
const hh=(i,s)=>{const v=Math.sin(i*12.9898+s*78.233)*43758.5453;return v-Math.floor(v)};
const hsl=(h,l)=>`hsl(${((h%360)+360)%360|0},100%,${l||62}%)`;
const iso=(x,y,z=0)=>[OX+(x-y)*TW/2,OY+(x+y)*TH/2-z];
function diamond(x,y,c,ex=0){const[a,b]=iso(x,y),p=[[a,b],[a+TW/2,b+TH/2],[a,b+TH],[a-TW/2,b+TH/2]];ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();}
function glowAt(x,y,r,col,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
const sheet=new Image(),atlas=new Image();let ld=0;sheet.onload=atlas.onload=()=>{if(++ld===2)go()};sheet.src='sheet.png';atlas.src='atlas4.png';
function tile(x,y){ // terrain
  const cx=6,cy=6,d=Math.hypot(x-cx,y-cy);let col;
  const path=(Math.abs(x-y)<=1)||(x>=5&&x<=7&&y>=2&&y<=10)||(y>=5&&y<=7&&x>=2&&x<=10);
  if(path)col=(x+y)%2?'#8d8a91':'#9a979f';else col=(x+y)%2?'#4f8a3f':'#5a9748';
  const water=(x>=9&&y<=2)||(x<=1&&y>=10);if(water)col=(x+y)%2?'#3f7fc0':'#4a8ccc';return col;}
function go(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1b2a4a');sky.addColorStop(1,'#2f3f66');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){ctx.fillStyle='rgba(255,255,255,'+(.2+hh(i,1)*.5)+')';ctx.fillRect(hh(i,2)*W,hh(i,3)*200,1.5,1.5);}
 // ground slab with side walls
 for(let s=0;s<N;s++){ // front edges
  const[a,b]=iso(N,s);const[c,d]=iso(N,s+1);ctx.fillStyle='#4a3a26';ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(c,d+34);ctx.lineTo(a,b+34);ctx.fill();
  const[e,f]=iso(s,N);const[g,h]=iso(s+1,N);ctx.fillStyle='#3a2c1c';ctx.beginPath();ctx.moveTo(e,f);ctx.lineTo(g,h);ctx.lineTo(g,h+34);ctx.lineTo(e,f+34);ctx.fill();}
 const objs=[];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){diamond(x,y,tile(x,y));
   if(hh(x*13+y,5)>.86&&tile(x,y).startsWith('#4')||tile(x,y)=='#5a9748'&&hh(x*7+y,6)>.9){const[a,b]=iso(x,y);ctx.strokeStyle='rgba(20,70,20,.6)';ctx.lineWidth=1.2;for(let k=0;k<4;k++){ctx.beginPath();ctx.moveTo(a+(k-2)*7,b+TH/2+3);ctx.lineTo(a+(k-2)*7+1,b+TH/2-4);ctx.stroke();}}}
 // grid lines subtle
 ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;for(let i=0;i<=N;i++){let[a,b]=iso(i,0),[c,d]=iso(i,N);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();[a,b]=iso(0,i);[c,d]=iso(N,i);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
 // objects
 const tree=(x,y,s=1)=>objs.push({y:x+y,f:()=>{const[a,b]=iso(x+.5,y+.5);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(a,b,38*s,17*s,0,0,TAU);ctx.fill();ctx.fillStyle='#5a3a1c';ctx.fillRect(a-7*s,b-52*s,14*s,52*s);for(const[dx,dy,r,c]of[[0,-95,42,'#2f7a2f'],[-24,-70,34,'#3a8a35'],[24,-72,34,'#2a6e2a'],[0,-120,30,'#4a9a3c']]){const g=ctx.createRadialGradient(a+dx*s-8,b+dy*s-8,3,a+dx*s,b+dy*s,r*s);g.addColorStop(0,'#7acb55');g.addColorStop(1,c);ctx.fillStyle=g;ctx.beginPath();ctx.arc(a+dx*s,b+dy*s,r*s,0,TAU);ctx.fill();}}});
 const rock=(x,y)=>objs.push({y:x+y,f:()=>{const[a,b]=iso(x+.5,y+.5);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(a,b+4,28,12,0,0,TAU);ctx.fill();const g=ctx.createLinearGradient(a-26,b-40,a+26,b);g.addColorStop(0,'#bdb9c4');g.addColorStop(1,'#6c6874');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(a-28,b);ctx.lineTo(a-18,b-30);ctx.lineTo(a+4,b-40);ctx.lineTo(a+24,b-22);ctx.lineTo(a+30,b);ctx.quadraticCurveTo(a,b+10,a-28,b);ctx.fill();ctx.strokeStyle='#3a3640';ctx.lineWidth=1.5;ctx.stroke();}});
 const lamp=(x,y)=>objs.push({y:x+y,f:()=>{const[a,b]=iso(x+.5,y+.5);ctx.fillStyle='#2a2430';ctx.fillRect(a-3,b-80,6,80);glowAt(a,b-86,70,'#ffc060',.7);ctx.fillStyle='#ffe090';ctx.beginPath();ctx.arc(a,b-86,8,0,TAU);ctx.fill();}});
 [[1,1],[3,0],[0,4],[10,7],[11,11],[5,12],[1,8],[12,4],[4,11],[10,2]].forEach(([x,y],i)=>tree(x,y,.85+hh(i,9)*.35));
 [[2,3],[9,9],[11,6],[3,9]].forEach(([x,y])=>rock(x,y));[[4,4],[10,9],[4,8],[8,3]].forEach(([x,y])=>lamp(x,y));
 // house block
 objs.push({y:3+3,f:()=>{const pts=(x,y)=>iso(x,y);const[a,b]=pts(2,1.2);}});
 // characters
 function shadow(a,b,r){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(a,b,r,r*.45,0,0,TAU);ctx.fill();}
 function herb(x,y){const[a,b]=iso(x+.5,y+.5);shadow(a,b,34);const hgt=190;ctx.drawImage(atlas,(38+2)*192,0,192,192,a-hgt/2,b-.96*hgt+6,hgt,hgt);}
 function slime(x,y,s,h,hurt){const[a,b]=iso(x+.5,y+.5);shadow(a,b,34*s);ctx.save();ctx.translate(a,b);const g=ctx.createRadialGradient(-s*10,-s*40,3,0,-s*24,s*40);g.addColorStop(0,hurt?'#ffd0f0':'#b8f0a0');g.addColorStop(1,hurt?'#c060d0':'#3e9a46');ctx.fillStyle=g;ctx.strokeStyle='#1c4a24';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-s*36,0);ctx.quadraticCurveTo(-s*40,-s*50,0,-s*54);ctx.quadraticCurveTo(s*40,-s*50,s*36,0);ctx.quadraticCurveTo(0,s*8,-s*36,0);ctx.fill();ctx.stroke();ctx.fillStyle='#143a1c';ctx.fillRect(-s*18,-s*26,s*10,3);ctx.fillRect(s*8,-s*26,s*10,3);ctx.restore();}
 function skel(x,y){const[a,b]=iso(x+.5,y+.5);shadow(a,b,30);ctx.save();ctx.translate(a,b);ctx.fillStyle='#6a4a8a';ctx.fillRect(-14,-62,28,40);ctx.strokeStyle='#2a1a3a';ctx.lineWidth=2;ctx.strokeRect(-14,-62,28,40);ctx.fillStyle='#f0e8d8';ctx.beginPath();ctx.arc(0,-82,19,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#1a1424';ctx.beginPath();ctx.arc(-7,-83,4.5,0,TAU);ctx.arc(7,-83,4.5,0,TAU);ctx.fill();ctx.fillRect(-9,-72,18,5);ctx.fillStyle='#f0e8d8';ctx.fillRect(-12,-22,8,22);ctx.fillRect(4,-22,8,22);ctx.strokeStyle='#8a8aa0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(20,-30);ctx.lineTo(34,-86);ctx.stroke();ctx.restore();}
 const en=[[8,5,'s',1],[9,6,'s',.9],[8,7,'s',1.1],[10,5,'k']];
 en.forEach(e=>objs.push({y:e[0]+e[1],f:()=>e[2]==='s'?slime(e[0],e[1],e[3],0,true):skel(e[0],e[1])}));
 objs.push({y:5+5,f:()=>herb(4,5)});
 objs.sort((a,b)=>a.y-b.y);objs.forEach(o=>o.f());
 // psychedelic spell: kaleidostorm centered on enemies
 const[ex,ey]=iso(8.8,6);const u=.5;
 for(let ring=0;ring<2;ring++){const R=(ring?150:230);for(let i=0;i<36;i++){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=hsl(i*10+ring*100,60);ctx.globalAlpha=.9;ctx.lineWidth=5-ring*1.5;ctx.beginPath();ctx.ellipse(ex,ey+25,R,R*.5,0,i/36*TAU,(i+1.3)/36*TAU);ctx.stroke();ctx.restore();}}
 for(let j=0;j<5;j++)for(let i=0;i<34;i++){const t=i/34,a=j*TAU/5+t*5.5+1.2,r=t*240;const x=ex+Math.cos(a)*r,y=ey+25+Math.sin(a)*r*.5-t*30;ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,(2+(1-t)*7)*2.4);g.addColorStop(0,'#fff');g.addColorStop(.3,hsl(t*360+j*70,62));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.globalAlpha=.4+.6*(1-t);ctx.fillRect(x-24,y-24,48,48);ctx.restore();}
 glowAt(ex,ey-20,150,'#c070ff',.5);
 // projectile trail from herb
 const[hx,hy]=iso(4.5,5.5);for(let i=0;i<10;i++){const t=i/10,x=hx+(ex-hx)*t*.55+30,y=hy-70+(ey-hy)*t*.55-Math.sin(t*3)*30;glowAt(x,y,16+i*1.2,hsl(i*40,62),.7);}
 // Herb aura
 glowAt(hx+4,hy-70,80,'#ff6ad8',.35);
 // damage floats
 const fl=(x,y,t,c)=>{ctx.font='bold 30px Georgia';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#1a0a2a';ctx.strokeText(t,x,y);ctx.fillStyle=c;ctx.fillText(t,x,y)};
 let p=iso(8.5,5.5);fl(p[0],p[1]-110,'-84','#ffd24a');p=iso(9.5,6.5);fl(p[0]+10,p[1]-105,'-91','#ff8ae8');p=iso(8.5,7.5);fl(p[0],p[1]-110,'-77','#5ef2f0');p=iso(10.5,5.5);fl(p[0],p[1]-150,'-120 CRIT','#ff5a5a');
 p=iso(4.5,5.5);ctx.font='bold 20px Georgia';ctx.fillStyle='#ff8ae8';ctx.strokeStyle='#1a0a2a';ctx.lineWidth=4;ctx.strokeText('caleidos',p[0],p[1]-200);ctx.fillText('caleidos',p[0],p[1]-200);
 // enemy hp bars
 for(const[x,y,w,hp]of[[8.5,5.5,70,.4],[9.5,6.5,60,.55],[8.5,7.5,76,.3],[10.5,5.5,70,.65]]){const q=iso(x,y);ctx.fillStyle='#000a';ctx.fillRect(q[0]-w/2,q[1]-w-100,w,8);ctx.fillStyle='#d94a4a';ctx.fillRect(q[0]-w/2+1,q[1]-w-99,(w-2)*hp,6);}
 // HUD
 ctx.fillStyle='rgba(10,8,20,.75)';ctx.strokeStyle='#4a4170';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(24,24,320,92,12);ctx.fill();ctx.stroke();
 ctx.font='bold 16px Georgia';ctx.fillStyle='#ffd97a';ctx.textAlign='left';ctx.fillText('Herb Gardener  Lv 52',44,52);
 for(const[y,c,v,t]of[[64,'#d94a4a',.72,'HP 412/570'],[88,'#4a7ae0',.55,'MP 190/345']]){ctx.fillStyle='#000a';ctx.fillRect(44,y,280,16);ctx.fillStyle=c;ctx.fillRect(45,y+1,278*v,14);ctx.font='bold 11px Verdana';ctx.fillStyle='#fff';ctx.fillText(t,50,y+12);}
 // hotbar
 const bx=W/2-7*34-6,by=H-86;ctx.fillStyle='rgba(10,8,20,.8)';ctx.beginPath();ctx.roundRect(bx-12,by-10,7*68+24,78,12);ctx.fill();ctx.stroke();
 for(let i=0;i<7;i++){const x=bx+i*68,y=by;ctx.fillStyle='#1b1630';ctx.strokeStyle=i===4?'#ffd97a':'#4a4170';ctx.lineWidth=i===4?3:2;ctx.beginPath();ctx.roundRect(x,y,58,58,10);ctx.fill();ctx.stroke();ctx.save();ctx.translate(x+29,y+29);
   if(i===4){for(let j=0;j<3;j++){ctx.strokeStyle=hsl(j*110+40,62);ctx.lineWidth=3;ctx.beginPath();for(let q=0;q<=24;q++){const t=q/24,a=j*2.1+t*5,r=t*22;q?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.stroke();}}
   else{ctx.fillStyle=hsl(i*55+10,60);ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(-4,-4,5,0,TAU);ctx.fill();}
   ctx.restore();ctx.font='bold 11px Verdana';ctx.fillStyle='#ffe9a8';ctx.textAlign='left';ctx.fillText(i+1,x+5,y+14);}
 // vignette + minimap hint
 const v=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.85);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,10,.5)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 window.done=true;}
</script>

<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const DPR=2,CW=640,CH=1000;const cv=document.getElementById('c');cv.width=CW*DPR;cv.height=CH*DPR;const ctx=cv.getContext('2d');ctx.scale(DPR,DPR);
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const TAU=Math.PI*2;
function glow(x,y,r,c,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function bg(x0,y0){ctx.save();ctx.beginPath();ctx.roundRect(x0+4,y0+4,312,242,12);ctx.clip();const g=ctx.createLinearGradient(0,y0,0,y0+250);g.addColorStop(0,'#2f5a38');g.addColorStop(1,'#3f7a3c');ctx.fillStyle=g;ctx.fillRect(x0,y0,320,250);
 ctx.strokeStyle='rgba(20,60,20,.5)';ctx.lineWidth=1;for(let k=0;k<70;k++){const x=x0+R()*320,y=y0+150+R()*100;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+1,y-4);ctx.stroke();}
 const s=ctx.createRadialGradient(x0+160,y0+215,5,x0+160,y0+215,150);s.addColorStop(0,'rgba(0,0,0,.25)');s.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=s;ctx.fillRect(x0,y0+150,320,100);ctx.restore();ctx.strokeStyle='#4a4170';ctx.beginPath();ctx.roundRect(x0+4,y0+4,312,242,12);ctx.stroke();}
const img=new Image();img.src='sheet.png';
function sprite(cx,feet,h){const w=h;ctx.save();ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,feet,h*.22,h*.05,0,0,TAU);ctx.fill();ctx.drawImage(img,0,0,256,256,cx-w/2,feet-.96*h,w,h);ctx.restore();return {x:u=>cx-w/2+u*w,y:v=>feet-.96*h+v*h};}
function slime(x,y,s,sleepy,stuck){ctx.save();ctx.translate(x,y);const g=ctx.createRadialGradient(-s*.2,-s*.6,2,0,-s*.4,s);g.addColorStop(0,'#b8f0a0');g.addColorStop(1,'#3e9a46');ctx.fillStyle=g;ctx.strokeStyle='#1c4a24';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-s,0);ctx.quadraticCurveTo(-s*1.05,-s*1.3,0,-s*1.35);ctx.quadraticCurveTo(s*1.05,-s*1.3,s,0);ctx.quadraticCurveTo(0,s*.25,-s,0);ctx.fill();ctx.stroke();
 ctx.fillStyle='#143a1c';if(sleepy){ctx.fillRect(-s*.5,-s*.62,s*.3,2);ctx.fillRect(s*.2,-s*.62,s*.3,2);}else{ctx.beginPath();ctx.arc(-s*.35,-s*.6,s*.13,0,TAU);ctx.arc(s*.35,-s*.6,s*.13,0,TAU);ctx.fill();}ctx.restore();}
function spore(x,y,r,c,a){glow(x,y,r*3,c,a*.7);ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();}
function leaf(x,y,a,s,c){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=c||'#5aa03a';ctx.strokeStyle='#1c4a1c';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(s/2,0,s/2,s/3.2,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}
function root(x0,y0,x1,y1,w,bend){ctx.save();ctx.lineCap='round';for(const[c,ww] of[['#2a160a',w+2],['#6e4a2a',w],['#a8774a',w*.35]]){ctx.strokeStyle=c;ctx.lineWidth=ww;ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo((x0+x1)/2+bend,(y0+y1)/2-bend*.6,x1,y1);ctx.stroke();}ctx.restore();}
function mush(x,y,s,glowA){ctx.save();ctx.translate(x,y);glow(0,-s*.9,s*2.2,'#ff6ad8',glowA);ctx.fillStyle='#f4e6c8';ctx.strokeStyle='#5a3a20';ctx.lineWidth=1;ctx.fillRect(-s*.18,-s*.7,s*.36,s*.7);ctx.strokeRect(-s*.18,-s*.7,s*.36,s*.7);const g=ctx.createLinearGradient(0,-s*1.6,0,-s*.6);g.addColorStop(0,'#ff7ae0');g.addColorStop(1,'#a8187a');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-s*.85,-s*.65);ctx.quadraticCurveTo(-s*.9,-s*1.65,0,-s*1.7);ctx.quadraticCurveTo(s*.9,-s*1.65,s*.85,-s*.65);ctx.quadraticCurveTo(0,-s*.45,-s*.85,-s*.65);ctx.fill();ctx.stroke();
 for(const[a,b,c] of[[-.35,-1.2,'#5ef2f0'],[.3,-1.4,'#a6f23a'],[.45,-.95,'#5ef2f0']]){glow(a*s,b*s,s*.5,c,glowA);ctx.fillStyle=c;ctx.beginPath();ctx.arc(a*s,b*s,s*.16,0,TAU);ctx.fill();}ctx.restore();}
function flower(x,y,s,c1,c2){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#2a6a2a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.3,-s*.8,0,-s*1.5);ctx.stroke();ctx.translate(0,-s*1.5);for(let k=0;k<6;k++){ctx.save();ctx.rotate(k*TAU/6);ctx.fillStyle=k%2?c1:c2;ctx.strokeStyle='rgba(60,10,50,.6)';ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(0,-s*.5,s*.28,s*.5,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}glow(0,0,s*1.4,c1,.5);ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(0,0,s*.22,0,TAU);ctx.fill();ctx.restore();}
function zz(x,y,s,a){ctx.save();ctx.globalAlpha=a;ctx.font='bold '+s+'px Georgia';ctx.fillStyle='#e8d4ff';ctx.strokeStyle='#5a2a8a';ctx.lineWidth=2;ctx.strokeText('z',x,y);ctx.fillText('z',x,y);ctx.restore();}
function draw(){
 const F=220,FEET=212;
 // row 0 Esporos
 for(let c=0;c<2;c++){const x0=c*320,y0=0;bg(x0,y0);const sp=sprite(x0+105,y0+FEET,F);const hx=sp.x(.7),hy=sp.y(.66);
  slime(x0+250,y0+FEET,28,c===1);
  if(c===0){glow(hx,hy,34,'#c070ff',.8);for(let k=0;k<26;k++){const t=k/26,x=hx+(x0+240-hx)*t*(.5+R()*.4),y=hy+Math.sin(t*5+k)*14-t*22+(R()-.5)*10;spore(x,y,1.4+R()*2,['#ff8ae8','#9a7aff','#5ef2f0','#e8ff9a'][k%4],.5+R()*.5);}}
  else{glow(x0+250,y0+170,70,'#a060ff',.7);for(let k=0;k<50;k++){const a=R()*TAU,r=10+R()*48;spore(x0+250+Math.cos(a)*r,y0+165+Math.sin(a)*r*.7,1.2+R()*2.2,['#ff8ae8','#9a7aff','#5ef2f0','#e8ff9a'][k%4],.4+R()*.5);}zz(x0+228,y0+118,22,.95);zz(x0+256,y0+98,28,.8);zz(x0+284,y0+74,34,.65);}}
 // row 1 Raizes
 for(let c=0;c<2;c++){const x0=c*320,y0=250;bg(x0,y0);const sp=sprite(x0+105,y0+FEET,F);slime(x0+250,y0+FEET,28,false);
  ctx.save();ctx.translate(x0+250,y0+FEET);ctx.scale(1,.32);ctx.strokeStyle='rgba(140,255,120,.9)';ctx.lineWidth=3;for(const r of[44,32]){ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();}ctx.restore();glow(x0+250,y0+FEET,46,'#6aff6a',.45);
  const n=c===0?5:9;for(let k=0;k<n;k++){const a=k/n*TAU,bx=x0+250+Math.cos(a)*38,by=y0+FEET+Math.sin(a)*11,h=c===0?18+R()*10:52+R()*34;root(bx,by,x0+250+Math.cos(a)*(c?14:30),by-h,c?7:4,(k%2?1:-1)*14);if(c)leaf(x0+250+Math.cos(a)*14,by-h,-1.2+k*.3,10,k%2?'#5aa03a':'#8ad83a');}
  if(c===1)for(let k=0;k<8;k++)spore(x0+215+R()*70,y0+100+R()*90,1.2+R()*1.6,'#a6f23a',.7);}
 // row 2 Cogumelo-mina
 for(let c=0;c<2;c++){const x0=c*320,y0=500;bg(x0,y0);const sp=sprite(x0+95,y0+FEET,F);
  if(c===0){slime(x0+255,y0+FEET,28,false);const bx=sp.x(.88),by=sp.y(.52);for(let k=0;k<10;k++){const t=k/10;spore(bx+(x0+205-bx)*t,by+(y0+FEET-8-by)*t+Math.sin(t*3)*-12,1.2+R()*1.4,'#ff8ae8',.5+t*.4);}mush(x0+205,y0+FEET,22,.9);}
  else{ctx.save();ctx.translate(x0+205,y0+FEET);ctx.scale(1,.34);for(const[r,a]of[[26,.9],[46,.6],[68,.35]]){ctx.strokeStyle=`rgba(255,160,240,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();}ctx.restore();glow(x0+205,y0+FEET-30,80,'#ff6ad8',.8);for(let k=0;k<60;k++){const a=R()*TAU,r=14+R()*64;spore(x0+205+Math.cos(a)*r,y0+FEET-30+Math.sin(a)*r*.75,1.3+R()*2.4,['#ff8ae8','#5ef2f0','#a6f23a','#ffd24a'][k%4],.5+R()*.5);}slime(x0+268,y0+FEET-44,24,false);ctx.save();ctx.translate(x0+205,y0+FEET-12);ctx.rotate(-.5);ctx.fillStyle='#f4e6c8';ctx.fillRect(-3,0,6,12);ctx.restore();}}
 // row 3 Florescer
 for(let c=0;c<2;c++){const x0=c*320,y0=750;bg(x0,y0);glow(x0+160,y0+FEET-60,c?120:70,'#7aff7a',c?.55:.35);const sp=sprite(x0+160,y0+FEET,F);glow(sp.x(.26),sp.y(.5),c?40:26,'#e040fb',c?.9:.55);
  const fl=c?[[-86,6,15],[-58,10,19],[60,8,18],[88,4,14],[-30,12,13],[34,12,14]]:[[-70,8,8],[-44,12,10],[48,10,9],[72,6,8]];for(const[dx,dy,s]of fl)flower(x0+160+dx,y0+FEET+dy*.4,s,['#ff7ae0','#ffb25c','#ffffff'][(Math.abs(dx)|0)%3],'#ff9a3a');
  for(let k=0;k<(c?36:14);k++){const a=R()*TAU,r=30+R()*70;const x=x0+160+Math.cos(a)*r*1.1,y=y0+FEET-30+Math.sin(a)*r*.8-R()*40;if(k%3===0)leaf(x,y,R()*TAU,7+R()*4,'#8ad83a');else spore(x,y,1.2+R()*1.8,['#a6f23a','#ff8ae8','#e8ffb0'][k%3],.7);}
  if(c){ctx.save();ctx.font='bold 26px Georgia';ctx.fillStyle='#b8ffb0';ctx.strokeStyle='#1c5a1c';ctx.lineWidth=3;ctx.strokeText('+85',x0+222,y0+70);ctx.fillText('+85',x0+222,y0+70);ctx.restore();}}
}
img.onload=()=>{draw();window.done=true;};
</script>
